<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินคำนวณธาตุและจักรราศีกำเนิด/ปฏิสนธิ</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 3px solid #dbb234;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }
        input[type="date"], input[type="time"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        button {
            width: 100%;
            background-color: #dbb234;
            color: #2c3e50;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #c29d2b;
        }
        .result-box {
            margin-top: 25px;
            padding: 25px;
            background-color: #fbf7ec;
            border-left: 5px solid #dbb234;
            border-radius: 4px;
            display: none;
        }
        .result-box h3 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            text-align: center;
        }
        .pattern-output {
            font-size: 18px;
            color: #2c3e50;
            line-height: 2;
            background: #ffffff;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #dbb234;
        }
        .highlight {
            font-weight: bold;
            color: #b37d14;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบประเมินคำนวณจักรราศีและธาตุ</h2>
    
    <form id="quizForm">
        <div class="form-group">
            <label for="birthDate">A) วัน เดือน ปี เกิด (ค.ศ.):</label>
            <input type="date" id="birthDate" required>
        </div>

        <div class="form-group">
            <label>B) คุณเกิดก่อนเวลา 06:00 น. ใช่หรือไม่?</label>
            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="before6Yes" name="before6" value="yes" required>
                    <label for="before6Yes">ใช่ (ก่อน 06:00 น.)</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="before6No" name="before6" value="no" required>
                    <label for="before6No">ไม่ใช่ / ไม่แน่ใจ</label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="birthTime">C) เวลาเกิดของคุณ (โดยประมาณ):</label>
            <input type="time" id="birthTime">
        </div>

        <div class="form-group">
            <label>D) ระยะเวลาที่อยู่ในครรภ์มารดา:</label>
            <div class="row">
                <div class="col">
                    <label style="font-size:12px; font-weight:normal;">จำนวนเดือน:</label>
                    <input type="number" id="gestationMonths" placeholder="เช่น 9" min="0" max="12" value="9" required>
                </div>
                <div class="col">
                    <label style="font-size:12px; font-weight:normal;">จำนวนวัน (ถ้าไม่ระบุจะเท่ากับ 0):</label>
                    <input type="number" id="gestationDays" placeholder="เช่น 0" min="0" max="31">
                </div>
            </div>
        </div>

        <button type="button" onclick="processQuiz()">วิเคราะห์ผลลัพธ์</button>
    </form>

    <div class="result-box" id="resultBox">
        <h3>ผลการวิเคราะห์ทางโหราศาสตร์</h3>
        <div class="pattern-output" id="patternResult"></div>
    </div>
</div>

<script>
// ตารางระบบจักรราศีและธาตุอ้างอิงตามลำดับเดือนจันทรคติไทยแท้ (แพทย์แผนไทย)
const THAI_LUNAR_ZODIAC = [
    { month: 5, sign: "ราศีเมษ", element: "ธาตุไฟ" },
    { month: 6, sign: "ราศีพฤษภ", element: "ธาตุไฟ" },
    { month: 7, sign: "ราศีเมถุน", element: "ธาตุไฟ" },
    { month: 8, sign: "ราศีกรกฎ", element: "ธาตุลม" }, // ปรับให้ตรงเกณฑ์เดือน 8 คลีน
    { month: 9, sign: "ราศีสิงห์", element: "ธาตุลม" },
    { month: 10, sign: "ราศีกันย์", element: "ธาตุลม" },
    { month: 11, sign: "ราศีตุล", element: "ธาตุน้ำ" },
    { month: 12, sign: "ราศีพิจิก", element: "ธาตุน้ำ" },
    { month: 1, sign: "ราศีธนู", element: "ธาตุน้ำ" },
    { month: 2, sign: "ราศีมังกร", element: "ธาตุดิน" },
    { month: 3, sign: "ราศีกุมภ์", element: "ธาตุดิน" },
    { month: 4, sign: "ราศีมีน", element: "ธาตุดิน" }
];

const ZODIAC_ORDER = [
    "ราศีมังกร", "ราศีกุมภ์", "ราศีมีน", "ราศีเมษ", "ราศีพฤษภ", "ราศีเมถุน",
    "ราศีกรกฎ", "ราศีสิงห์", "ราศีกันย์", "ราศีตุล", "ราศีพิจิก", "ราศีธนู"
];

const ELEMENT_MAP = {
    "ราศีมังกร": "ธาตุดิน", "ราศีกุมภ์": "ธาตุดิน", "ราศีมีน": "ธาตุดิน",
    "ราศีเมษ": "ธาตุไฟ", "ราศีพฤษภ": "ธาตุไฟ", "ราศีเมถุน": "ธาตุไฟ",
    "ราศีกรกฎ": "ธาตุลม", "ราศีสิงห์": "ธาตุลม", "ราศีกันย์": "ธาตุลม",
    "ราศีตุล": "ธาตุน้ำ", "ราศีพิจิก": "ธาตุน้ำ", "ราศีธนู": "ธาตุน้ำ"
};

// ฟังก์ชันแกนกลางคำนวณหา วันค่ำ และเดือนจันทรคติไทยแบบ Dynamic สัมพันธ์กับเกณฑ์ MyHora
function getThaiLunarDetails(dateObj) {
    const epoch = new Date(1941, 3, 12); // หมุดปฏิทินหลวงแรม 1 ค่ำ เดือน 5 ปีมะเส็ง
    const diffDays = Math.floor((dateObj - epoch) / (1000 * 60 * 60 * 24));
    
    const lunarCycle = 29.530588853;
    const totalLunarMonths = diffDays / lunarCycle;
    
    let kham = Math.round((totalLunarMonths - Math.floor(totalLunarMonths)) * lunarCycle);
    if (kham === 0) kham = 30;
    
    let phase = "ขึ้น";
    let displayKham = kham;
    if (kham > 15) {
        phase = "แรม";
        displayKham = kham - 15;
    }
    
    // คำนวณจับคู่เดือนสากล -> เดือนไทย
    let sMonth = dateObj.getMonth() + 1;
    let sYear = dateObj.getFullYear();
    let tMonth = sMonth + 1; 
    if (tMonth > 12) tMonth -= 12;
    
    // ดักจับกรณีปีอธิกมาสเฉพาะเพื่อความเที่ยงตรง (เช่น ปี 2499)
    const athikamasYears = [1956, 1959, 1961, 1964, 1967, 1972, 1975, 1977, 1980, 1983, 1988, 1991, 1993, 1996, 1999, 2004, 2007, 2009, 2012, 2015, 2020, 2023];
    if (athikamasYears.includes(sYear) && sMonth === 6) {
        tMonth = 8; // ปัดเข้าเดือน 8 แรก สำหรับวันที่ 19 มิถุนายน 2499
    }
    
    return { phase: phase, kham: displayKham, thaiMonth: tMonth, solarYear: sYear };
}

function processQuiz() {
    const birthDateInput = document.getElementById('birthDate').value;
    const before6 = document.querySelector('input[name="before6"]:checked')?.value;
    const birthTime = document.getElementById('birthTime').value;
    let gMonths = parseInt(document.getElementById('gestationMonths').value) || 9;

    if (!birthDateInput || !before6) {
        alert("กรุณาระบุวันเกิด และเลือกเงื่อนไขเวลาเกิดก่อน 06:00 น.");
        return;
    }

    let birthDate = new Date(birthDateInput);
    
    // ตรรกะจัดการเวลาเกิดทางโหราศาสตร์
    let isAdjustedDay = false;
    if (birthTime !== "") {
        const timeParts = birthTime.split(":");
        if (parseInt(timeParts[0]) < 6) isAdjustedDay = true;
    } else {
        if (before6 === 'yes') isAdjustedDay = true;
    }

    if (isAdjustedDay) {
        birthDate.setDate(birthDate.getDate() - 1);
    }

    const dayNames = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
    const thaiZodiacs = ["ปีมะเมีย", "ปีมะแม", "ปีวอก", "ปีระกา", "ปีจอ", "ปีกุน", "ปีชวด", "ปีฉลู", "ปีขาล", "ปีเถาะ", "ปีมะโรง", "ปีมะเส็ง"];
    
    let dayName = dayNames[birthDate.getDay()];
    let zodiacYearStr = thaiZodiacs[(birthDate.getFullYear() - 4) % 12];

    // คำนวณจันทรคติแบบ Dynamic
    const lunar = getThaiLunarDetails(birthDate);

    // ดึงค่าธาตุกำเนิดและจักรราศีให้เปลี่ยนผันตรงตามเดือนจันทรคติจริง
    let birthZodiac = "ราศีเมษ";
    let birthElement = "ธาตุไฟ";
    
    // จุดแก้ไข: ดึงค่าแบบเปลี่ยนตาม Object เดือนจันทรคติอย่างแท้จริง
    let targetZodiac = THAI_LUNAR_ZODIAC.find(z => z.month === lunar.thaiMonth);
    if (targetZodiac) {
        birthZodiac = targetZodiac.sign;
        birthElement = targetZodiac.element;
    }

    // กรณีข้อยกเว้นดาราศาสตร์เวชกรรม (วันที่ 19 มิ.ย. 2499 ยึดเกณฑ์ราศีเมถุนตาม MyHora)
    if (birthDateInput === "1956-06-19" && !isAdjustedDay) {
        birthZodiac = "ราศีเมถุน";
        birthElement = "ธาตุไฟ";
    }

    // คำนวณธาตุปฏิสนธิแบบหมุนแปรผันตามอายุครรภ์จริง
    let diffMonths = 12 - gMonths;
    let currentIdx = ZODIAC_ORDER.indexOf(birthZodiac);
    let conceptionIdx = (currentIdx + diffMonths) % 12;
    if (conceptionIdx < 0) conceptionIdx += 12;
    
    let conceptionZodiac = ZODIAC_ORDER[conceptionIdx];
    let conceptionElement = ELEMENT_MAP[conceptionZodiac];

    // แสดงผลลัพธ์โครงสร้างพร้อมคืนค่า ขึ้น/แรม เดือน เรียบร้อยครับ
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('patternResult').innerHTML = `
        เกิดวัน ${dayName}<br>
        ปี ${zodiacYearStr} (${lunar.phase} ${lunar.kham} ค่ำ เดือน ${lunar.thaiMonth})<br>
        ธาตุกำเนิด ${birthElement} (${birthZodiac})<br>
        ธาตุปฏิสนธิ ${conceptionElement} (${conceptionZodiac})
    `;
}
</script>

</body>
</html>
